<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>福岡中小企業家同友会マップ</title>
<style>
  :root {
    --primary: #2E7D32;
    --primary-dark: #1B5E20;
    --primary-bg: #E8F5E9;
    --accent: #FF6F00;
    --bg: #f2f2f2;
    --white: #fff;
    --text: #222;
    --text-light: #666;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Segoe UI',sans-serif; background:var(--bg); color:var(--text); }

  /* ===== HEADER ===== */
  .header {
    background: var(--primary-dark);
    color:#fff; padding: 10px 14px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:500;
  }
  .header-logo { font-size:16px; font-weight:800; display:flex; align-items:center; gap:8px; }
  .header-logo .badge { background:#fff; color:var(--primary-dark); border-radius:14px; padding:2px 10px; font-size:12px; font-weight:800; white-space:nowrap; }
  .header-toggle { background:none; border:none; color:#fff; font-size:20px; cursor:pointer; padding:4px 8px; transition:transform .2s; }
  .header-toggle.closed { transform:rotate(180deg); }

  /* ===== CONTROLS ===== */
  #controls { background:#111; padding:12px 14px; display:flex; flex-direction:column; gap:10px; position:sticky; top:48px; z-index:499; }
  #controls.hidden { display:none; }
  .search-row { display:flex; gap:8px; }
  .search-row input {
    flex:1; padding:12px 18px; border-radius:26px; border:none; font-size:16px; outline:none;
  }
  .filter-row { display:flex; gap:8px; }
  .filter-row select {
    flex:1; min-width:0; padding:10px 8px; border-radius:8px; border:none; font-size:14px; background:#fff; color:var(--text);
  }
  .btn-search {
    background:var(--primary); color:#fff; border:none; border-radius:8px;
    padding:10px 16px; font-size:16px; font-weight:700; cursor:pointer; white-space:nowrap;
  }

  /* ===== GENRE CHIPS ===== */
  .chip-row { display:flex; gap:8px; overflow-x:auto; padding:10px 14px; background:var(--white); -webkit-overflow-scrolling:touch; }
  .chip-row::-webkit-scrollbar { display:none; }
  .chip {
    flex:0 0 auto; padding:7px 16px; border-radius:18px; background:#1a1a1a; color:#fff;
    font-size:13px; font-weight:600; cursor:pointer; border:2px solid transparent; user-select:none;
  }
  .chip.active { background:var(--primary); }

  /* ===== MAP ===== */
  #map { width:100%; height:46vh; min-height:280px; background:#dde5dd; position:relative; }
  .map-note { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--text-light); font-size:14px; text-align:center; padding:20px; }

  /* ===== NOTICE ===== */
  .notice { text-align:center; font-size:13px; color:var(--text-light); padding:12px; background:var(--bg); }

  /* ===== CARDS ===== */
  #cards { max-width:640px; margin:0 auto; padding:0 0 40px; }
  .card { background:var(--white); margin-bottom:14px; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .card-img { width:100%; height:200px; object-fit:cover; display:block; background:#eee; }
  .card-body { padding:14px 16px 16px; }
  .tag-row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .tag { font-size:11px; font-weight:700; padding:3px 10px; border-radius:12px; color:#fff; }
  .card-name { font-size:18px; font-weight:800; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .card-dist { font-size:13px; color:#1a73e8; font-weight:700; }
  .card-addr { font-size:13px; color:var(--text-light); margin-top:6px; }
  .card-owner { font-size:13px; margin-top:8px; display:flex; align-items:center; gap:6px; }
  .card-owner .icon { color:var(--primary); }
  .card-desc { font-size:13px; color:var(--text-light); margin-top:8px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card-links { display:flex; gap:14px; margin-top:10px; }
  .card-links a { font-size:13px; font-weight:700; text-decoration:none; }
  .empty { text-align:center; padding:60px 20px; color:var(--text-light); }
  .empty .icon { font-size:44px; margin-bottom:12px; }

  /* ===== FOOTER ===== */
  footer { background:var(--primary-dark); color:#fff; text-align:center; padding:24px 16px; font-size:13px; }
  footer .f-title { font-size:16px; font-weight:800; margin-bottom:4px; }

  @media (min-width:641px) {
    .header-logo { font-size:19px; }
    #map { height:52vh; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-logo"><span class="badge">同友会</span>福岡中小企業家同友会マップ</div>
  <button class="header-toggle" id="ctrl-toggle" onclick="toggleControls()">⌃</button>
</header>

<div id="controls">
  <div class="search-row">
    <input id="q" type="search" placeholder="店舗名・オーナー名を入力" oninput="applyFilters()">
  </div>
  <div class="filter-row">
    <select id="area-select" onchange="applyFilters()"><option value="">エリア</option></select>
    <select id="genre-select" onchange="syncGenreFromSelect()"><option value="">ジャンル</option></select>
    <button class="btn-search" onclick="applyFilters()">🔍</button>
  </div>
</div>

<div class="chip-row" id="chip-row"></div>

<div id="map"><div class="map-note">地図を読み込んでいます…</div></div>

<div class="notice" id="notice">読み込み中…</div>

<div id="cards"></div>

<footer>
  <div class="f-title">福岡中小企業家同友会マップ</div>
  <div>FUKUOKA DOYUKAI MAP</div>
</footer>

<script>
// ===== 設定 =====
const SHEET_ID = '1dwk0AfGjzaCWqHI0ForHLXH8BziS5BEBGvv7urlhqdY';
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv';
const GMAPS_API_KEY = ''; // ← Google Maps APIキーをここに入れる

// ===== ジャンル =====
const GENRES = [
  { name: '朝食',        color: '#F57C00' },
  { name: 'ランチ',      color: '#43A047' },
  { name: 'ディナー',    color: '#8E24AA' },
  { name: 'カフェ',      color: '#6D4C41' },
  { name: 'Bar・スナック', color: '#AD1457' },
];
const GENRE_MAP = {};
GENRES.forEach(g => GENRE_MAP[g.name] = g);

// ===== CSVパーサ =====
function parseCSV(text) {
  const rows = []; let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ',') { row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i+1] === '\n') i++;
      row.push(field); field = '';
      if (row.length > 1 || row[0] !== '') rows.push(row);
      row = [];
    } else field += ch;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function deriveArea(address) {
  if (!address) return '';
  const a = address.replace(/〒[0-9\-]+\s*/, '').replace(/^福岡県\s*/, '');
  let m = a.match(/^((?:福岡市|北九州市|久留米市)[^0-9０-９]{1,3}区)/);
  if (m) return m[1];
  m = a.match(/^(.{2,6}?[市町村])/);
  return m ? m[1] : '';
}

function rowsToStores(rows) {
  if (!rows.length) return [];
  const idx = {};
  rows[0].forEach((h, i) => idx[h.trim()] = i);
  const get = (r, name) => { const i = idx[name]; return i == null ? '' : String(r[i] || '').trim(); };
  const out = [];
  rows.slice(1).forEach((r, n) => {
    const name = get(r, '店名');
    if (!name || name === 'サンプル食堂') return;
    const address = get(r, '住所');
    const lat = parseFloat(get(r, '緯度')), lng = parseFloat(get(r, '経度'));
    const genres = get(r, 'カテゴリ').split(/[、,・\/]+/).map(s => s.trim()).filter(Boolean);
    out.push({
      id: 'row_' + (n + 2),
      name, address,
      genres,
      area: deriveArea(address),
      owner: get(r, 'オーナー'),
      desc: get(r, '説明'),
      phone: get(r, '電話'),
      url: get(r, 'ウェブサイト'),
      img: get(r, '画像URL'),
      lat: isNaN(lat) ? null : lat,
      lng: isNaN(lng) ? null : lng,
      dist: null
    });
  });
  return out;
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function gq(s) { return (s.lat && s.lng) ? (s.lat + ',' + s.lng) : encodeURIComponent(s.address || s.name); }

// ===== 状態 =====
let stores = [];
let filtered = [];
let selectedGenre = '';
let userPos = null;
let gmap = null, gInfo = null;
let gMarkers = {};

// ===== 距離 =====
function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371, d2r = Math.PI / 180;
  const dLat = (lat2-lat1)*d2r, dLng = (lng2-lng1)*d2r;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*d2r)*Math.cos(lat2*d2r)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ===== UI構築 =====
function buildChips() {
  document.getElementById('chip-row').innerHTML =
    GENRES.map(g => `<span class="chip" data-g="${g.name}" onclick="selectGenre('${g.name}')">${g.name}</span>`).join('');
}
function buildGenreSelect() {
  document.getElementById('genre-select').innerHTML =
    '<option value="">ジャンル</option>' + GENRES.map(g => `<option value="${g.name}">${g.name}</option>`).join('');
}
function buildAreaSelect() {
  const areas = [...new Set(stores.map(s => s.area).filter(Boolean))].sort();
  document.getElementById('area-select').innerHTML =
    '<option value="">エリア</option>' + areas.map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join('');
}
function toggleControls() {
  document.getElementById('controls').classList.toggle('hidden');
  document.getElementById('ctrl-toggle').classList.toggle('closed');
}
function selectGenre(name) {
  selectedGenre = (selectedGenre === name) ? '' : name;
  document.getElementById('genre-select').value = selectedGenre;
  applyFilters();
}
function syncGenreFromSelect() {
  selectedGenre = document.getElementById('genre-select').value;
  applyFilters();
}

// ===== フィルタ＆描画 =====
function applyFilters() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const area = document.getElementById('area-select').value;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.g === selectedGenre));
  filtered = stores.filter(s => {
    if (q && !(s.name.toLowerCase().includes(q) || (s.owner||'').toLowerCase().includes(q))) return false;
    if (area && s.area !== area) return false;
    if (selectedGenre && !s.genres.includes(selectedGenre)) return false;
    return true;
  });
  if (userPos) filtered.sort((a,b) => (a.dist ?? 1e9) - (b.dist ?? 1e9));
  renderCards();
  renderMarkers();
}

function genreTags(s) {
  return s.genres.map(g => {
    const c = GENRE_MAP[g] ? GENRE_MAP[g].color : '#757575';
    return `<span class="tag" style="background:${c}">${esc(g)}</span>`;
  }).join('');
}

function renderCards() {
  const el = document.getElementById('cards');
  if (!filtered.length) {
    el.innerHTML = '<div class="empty"><div class="icon">🔍</div>該当する店舗がありません</div>';
    return;
  }
  el.innerHTML = filtered.map(s => `
    <div class="card" onclick="focusStore('${s.id}')">
      ${s.img ? `<img class="card-img" loading="lazy" src="${esc(s.img)}" alt="${esc(s.name)}" onerror="this.remove()">` : ''}
      <div class="card-body">
        <div class="tag-row">${genreTags(s)}</div>
        <div class="card-name">${esc(s.name)}${s.dist!=null?`<span class="card-dist">約${s.dist<10?s.dist.toFixed(1):Math.round(s.dist)}km</span>`:''}</div>
        ${s.address?`<div class="card-addr">${esc(s.address)}</div>`:''}
        ${s.owner?`<div class="card-owner"><span class="icon">👤</span>${esc(s.owner)}</div>`:''}
        ${s.desc?`<div class="card-desc">${esc(s.desc)}</div>`:''}
        <div class="card-links" onclick="event.stopPropagation()">
          <a href="https://www.google.com/maps?q=${gq(s)}" target="_blank" rel="noopener" style="color:#1a73e8;">📍 Googleマップ</a>
          <a href="https://www.google.com/maps/dir/?api=1&destination=${gq(s)}" target="_blank" rel="noopener" style="color:#e53935;">🚗 ルート案内</a>
          ${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:var(--primary);">🔗 サイト</a>`:''}
        </div>
      </div>
    </div>`).join('');
}

// ===== Google Maps =====
function loadGoogleMaps() {
  if (!GMAPS_API_KEY) {
    document.getElementById('map').innerHTML = '<div class="map-note">🗺️ Googleマップは APIキー設定後に表示されます。<br>店舗一覧・検索はこのままご利用いただけます。</div>';
    return;
  }
  const sc = document.createElement('script');
  sc.src = 'https://maps.googleapis.com/maps/api/js?key=' + GMAPS_API_KEY + '&callback=initGMap&language=ja&region=JP';
  sc.async = true;
  sc.onerror = () => { document.getElementById('map').innerHTML = '<div class="map-note">⚠️ Googleマップを読み込めませんでした。APIキーをご確認ください。</div>'; };
  document.head.appendChild(sc);
}

function initGMap() {
  document.getElementById('map').innerHTML = '';
  gmap = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 33.59, lng: 130.40 }, zoom: 12,
    mapTypeControl: true, streetViewControl: true, fullscreenControl: true,
    gestureHandling: 'cooperative'
  });
  gInfo = new google.maps.InfoWindow();
  renderMarkers();
}

function renderMarkers() {
  if (!gmap) return;
  Object.values(gMarkers).forEach(m => m.setMap(null));
  gMarkers = {};
  const bounds = new google.maps.LatLngBounds();
  let count = 0;
  filtered.forEach(s => {
    if (s.lat == null || s.lng == null) return;
    const g = GENRE_MAP[s.genres[0]];
    const color = g ? g.color : '#2E7D32';
    const marker = new google.maps.Marker({
      map: gmap, position: { lat: s.lat, lng: s.lng }, title: s.name,
      icon: { path: google.maps.SymbolPath.CIRCLE, scale: 11, fillColor: color, fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2.5 }
    });
    marker.addListener('click', () => openInfo(s));
    gMarkers[s.id] = marker;
    bounds.extend(marker.getPosition());
    count++;
  });
  if (userPos) { bounds.extend(userPos); }
  if (count) gmap.fitBounds(bounds, 40);
}

function openInfo(s) {
  if (!gmap || !gMarkers[s.id]) return;
  gInfo.setContent(`
    <div style="min-width:180px;max-width:240px;">
      <div style="font-weight:800;font-size:15px;margin-bottom:4px;">${esc(s.name)}</div>
      <div style="margin-bottom:4px;">${genreTags(s)}</div>
      ${s.owner?`<div style="font-size:12px;color:#666;">👤 ${esc(s.owner)}</div>`:''}
      ${s.address?`<div style="font-size:12px;color:#666;margin-top:2px;">📍 ${esc(s.address)}</div>`:''}
      <div style="margin-top:6px;">
        <a href="https://www.google.com/maps?q=${gq(s)}" target="_blank" rel="noopener" style="font-size:12px;font-weight:700;color:#1a73e8;">Googleマップで開く</a>
      </div>
    </div>`);
  gInfo.open(gmap, gMarkers[s.id]);
}

function focusStore(id) {
  const s = stores.find(x => x.id === id);
  if (!s) return;
  if (gmap && s.lat != null) {
    gmap.panTo({ lat: s.lat, lng: s.lng });
    gmap.setZoom(16);
    openInfo(s);
    document.getElementById('map').scrollIntoView({ behavior: 'smooth' });
  } else {
    window.open('https://www.google.com/maps?q=' + gq(s), '_blank');
  }
}

// ===== 現在地 =====
function requestLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    stores.forEach(s => { if (s.lat != null) s.dist = haversine(userPos.lat, userPos.lng, s.lat, s.lng); });
    document.getElementById('notice').textContent = '現在地から近い順に表示しております。';
    applyFilters();
  }, () => {
    document.getElementById('notice').textContent = '店舗一覧（登録順に表示）';
  }, { timeout: 8000 });
}

// ===== 初期化 =====
async function fetchStores() {
  const res = await fetch(SHEET_CSV_URL + '&_t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return rowsToStores(parseCSV(await res.text()));
}

document.addEventListener('DOMContentLoaded', async () => {
  buildChips();
  buildGenreSelect();
  try {
    stores = await fetchStores();
  } catch (e) {
    console.error(e);
    document.getElementById('notice').textContent = '';
    document.getElementById('cards').innerHTML = '<div class="empty"><div class="icon">⚠️</div>データを読み込めませんでした。<br>スプレッドシートの共有設定をご確認ください。</div>';
    return;
  }
  buildAreaSelect();
  document.getElementById('notice').textContent = '店舗一覧（登録順に表示）';
  filtered = [...stores];
  applyFilters();
  loadGoogleMaps();
  requestLocation();
});
</script>
</body>
</html>
